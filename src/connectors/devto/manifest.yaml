key: devto
name: Dev.to / Forem Developer Community
version: 1.0.0
tier: native
auth: api_key
surfaces:
  - key: article
    content_types: [text, image]
    spec:
      title_min_chars: 5
      title_max_chars: 128
      body_min_chars: 30
      body_max_chars: 25000
      links_allowed: true
rate_limits:
  per_connection:
    requests: 30
    per_seconds: 30
capabilities: [publish, status, delete, metrics]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "401": CONNECTION_AUTH_EXPIRED
  "403": CONNECTION_AUTH_EXPIRED
  "422": PLATFORM_CONTENT_REJECTED
  "4xx": PLATFORM_CONTENT_REJECTED
  "5xx": PLATFORM_UNAVAILABLE
instance_param: base_url
