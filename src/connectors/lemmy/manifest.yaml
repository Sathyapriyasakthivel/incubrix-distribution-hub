key: lemmy
name: Lemmy Federated Community
version: 1.0.0
tier: native
auth: bot_token
surfaces:
  - key: post
    content_types: [text, image, video_link]
    spec:
      title_min_chars: 3
      title_max_chars: 200
      body_min_chars: 5
      body_max_chars: 10000
      links_allowed: true
rate_limits:
  per_connection:
    requests: 30
    per_seconds: 60
capabilities: [publish, status, delete, metrics]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "401": CONNECTION_AUTH_EXPIRED
  "403": CONNECTION_AUTH_EXPIRED
  "422": PLATFORM_CONTENT_REJECTED
  "4xx": PLATFORM_CONTENT_REJECTED
  "5xx": PLATFORM_UNAVAILABLE
instance_param: base_url
